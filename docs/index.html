<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPS Price Index — live cloud server prices from the providers' own APIs</title>
<meta name="description" content="Every VPS price here is pulled live from the provider's own public pricing API. Nothing is hand-typed. Compare Vultr, Akamai/Linode, Scaleway and AWS Lightsail by price, RAM, vCPU and $/GB.">
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--acc:#3fb950;--acc2:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc2)}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 64px}
h1{font-size:27px;margin:0 0 6px;letter-spacing:-.4px}
.sub{color:var(--dim);margin:0 0 18px;font-size:14px}
.badge{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--dim);margin:0 6px 6px 0}
.badge b{color:var(--acc)}
.disc{background:#1c2128;border:1px solid var(--line);border-left:3px solid #d29922;border-radius:6px;padding:11px 14px;font-size:13px;color:var(--dim);margin:0 0 18px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px}
.controls label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px}
input,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px}
input[type=number]{width:78px}
input[type=search]{width:160px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{cursor:pointer;user-select:none;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--bg)}
th:hover{color:var(--fg)}
th.up::after{content:" ▲";color:var(--acc)}
th.down::after{content:" ▼";color:var(--acc)}
tbody tr:hover{background:#161b22}
td.num{text-align:right}
.prov{color:var(--dim);font-size:12.5px}
.plan{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.price{color:var(--acc);font-weight:600}
.aff{color:#d29922;font-size:10px;vertical-align:super}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
footer{margin-top:26px;color:var(--dim);font-size:12.5px;line-height:1.8}
code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:12px}
.err{color:#f85149}
</style>
</head>
<body>
<div class="wrap">
<h1>VPS Price Index</h1>
<p class="sub">Every number below is pulled <b>live from the provider's own public pricing API</b>. Nothing is hand-typed, nothing is remembered from a blog post. <a href="https://github.com/p32929/vps-price-index">The script that fetches it is open source.</a> <a href="changes.html"><b>See what changed this week →</b></a></p>
<div id="meta"></div>
<div id="disclosure"></div>

<div class="controls">
  <label>provider <select id="f-prov"><option value="">all</option></select></label>
  <label>min RAM GB <input type="number" id="f-ram" min="0" step="0.5"></label>
  <label>min vCPU <input type="number" id="f-cpu" min="0" step="1"></label>
  <label>max $/mo <input type="number" id="f-max" min="0" step="1"></label>
  <label>search <input type="search" id="f-q" placeholder="plan name"></label>
  <label><input type="checkbox" id="f-net"> has bandwidth data</label>
  <span id="count" class="badge"></span>
</div>

<div class="scroll"><table>
<thead><tr>
  <th data-k="provider">Provider</th>
  <th data-k="plan">Plan</th>
  <th data-k="vcpu" class="num">vCPU</th>
  <th data-k="ram_gb" class="num">RAM GB</th>
  <th data-k="disk_gb" class="num">Disk GB</th>
  <th data-k="transfer_tb" class="num">Transfer TB</th>
  <th data-k="usd" class="num">$ / mo</th>
  <th data-k="usd_per_gb_ram" class="num">$ / GB RAM</th>
</tr></thead>
<tbody id="rows"></tbody>
</table></div>

<footer id="foot"></footer>
</div>

<script>
let DATA=null, PARTNERS=null, sortKey='usd', sortDir=1;

Promise.all([
  fetch('plans.json').then(r=>r.json()),
  fetch('partners.json').then(r=>r.json())
]).then(([d,p])=>{
  DATA=d; PARTNERS=p;
  const provs=[...new Set(d.plans.map(x=>x.provider))].sort();
  const sel=document.getElementById('f-prov');
  provs.forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;sel.appendChild(o)});

  document.getElementById('meta').innerHTML =
    `<span class="badge"><b>${d.plan_count}</b> plans</span>`+
    `<span class="badge"><b>${provs.length}</b> providers</span>`+
    `<span class="badge">built <b>${d.generated_utc}</b></span>`+
    (d.fx?`<span class="badge">EUR→USD <b>${d.fx.EUR_USD}</b> (${d.fx.date})</span>`:'')+
    (Object.keys(d.errors||{}).length?`<span class="badge err">${Object.keys(d.errors).length} source(s) failed and were dropped, not served stale</span>`:'');

  if(Object.values(p.providers).some(x=>x.affiliate))
    document.getElementById('disclosure').innerHTML=`<div class="disc">${p._disclosure}</div>`;

  document.querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    sortDir = (k===sortKey) ? -sortDir : 1;
    sortKey = k; render();
  });
  ['f-prov','f-ram','f-cpu','f-max','f-q','f-net'].forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener(el.type==='checkbox'?'change':'input',render);
  });

  const srcs=Object.entries(d.sources).map(([k,v])=>`<a href="${v}">${k}</a>`).join(' · ');
  document.getElementById('foot').innerHTML =
    `<div><b>Sources</b> (all public, all unauthenticated — click any of them and check the number yourself): ${srcs}</div>`+
    `<div>Prices are the providers' own list prices, exclusive of tax. Scaleway publishes in EUR; the $ column converts at the single dated rate shown above, from <a href="https://frankfurter.app">frankfurter.app</a>. AWS Lightsail is hourly × 730h (AWS's own monthly convention), Linux, us-east-1.</div>`+
    `<div>Rebuilt daily by GitHub Actions. If a provider's API breaks, that provider is <b>dropped from the build</b> rather than shown stale — see <code>errors</code> in <a href="plans.json">plans.json</a>.</div>`+
    `<div><a href="plans.json">plans.json</a> is the raw machine-readable dataset — use it in your own tooling, it's CC0.</div>`;
  render();
});

function render(){
  const prov=document.getElementById('f-prov').value;
  const ram=parseFloat(document.getElementById('f-ram').value)||0;
  const cpu=parseFloat(document.getElementById('f-cpu').value)||0;
  const max=parseFloat(document.getElementById('f-max').value)||Infinity;
  const q=document.getElementById('f-q').value.toLowerCase();
  const net=document.getElementById('f-net').checked;

  let rows=DATA.plans.filter(p=>
    (!prov||p.provider===prov) && p.ram_gb>=ram && p.vcpu>=cpu &&
    (p.usd??Infinity)<=max && (!q||p.plan.toLowerCase().includes(q)) &&
    (!net||p.transfer_tb>0));

  rows.sort((a,b)=>{
    const x=a[sortKey], y=b[sortKey];
    if(x==null) return 1; if(y==null) return -1;
    return (typeof x==='string' ? x.localeCompare(y) : x-y) * sortDir;
  });

  document.querySelectorAll('th').forEach(th=>{
    th.className = th.classList.contains('num')?'num':'';
    if(th.dataset.k===sortKey) th.classList.add(sortDir>0?'up':'down');
  });

  document.getElementById('count').innerHTML=`showing <b>${rows.length}</b>`;
  document.getElementById('rows').innerHTML = rows.map(p=>{
    const pt=PARTNERS.providers[p.provider]||{};
    const link=pt.url?`<a href="${pt.url}" rel="${pt.affiliate?'sponsored nofollow noopener':'noopener'}" target="_blank">${p.provider}</a>${pt.affiliate?'<span class="aff" title="affiliate link">ad</span>':''}`:p.provider;
    const nat=p.currency!=='USD'?` <span class="prov">(${p.price} ${p.currency})</span>`:'';
    return `<tr>
      <td class="prov">${link}</td>
      <td class="plan">${p.plan}</td>
      <td class="num">${p.vcpu}</td>
      <td class="num">${p.ram_gb}</td>
      <td class="num">${p.disk_gb||'—'}</td>
      <td class="num">${p.transfer_tb||'—'}</td>
      <td class="num price">${p.usd!=null?'$'+p.usd.toFixed(2):'—'}${nat}</td>
      <td class="num">${p.usd_per_gb_ram!=null?'$'+p.usd_per_gb_ram.toFixed(2):'—'}</td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
